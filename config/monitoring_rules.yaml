# Transaction-monitoring scenario parameters.
#
# These values are loaded into a DuckDB table (`rule_params`) and joined into
# every scenario query. Nothing is hardcoded in SQL: ATL/BTL tuning rewrites
# this table in-memory and re-executes the identical SQL, which is the only way
# a threshold sweep is defensible under model risk management.
rule_version: "tm-v2.1.0"

scenarios:
  - id: R01_STRUCTURING
    name: Cash structuring below CTR threshold
    description: >-
      Multiple cash credits landing just under the 10,000 CTR reporting
      threshold within a short window. Classic 31 CFR 1010.314 evasion.
    params:
      lower_bound: 8200.0
      upper_bound: 9999.0
      min_txn_count: 3
      window_days: 10
    sweep_param: min_txn_count
    sweep_values: [2, 3, 4, 5, 6, 8]

  - id: R02_VELOCITY
    name: Rapid movement of funds
    description: >-
      Credits followed by near-equivalent debits inside a short holding period —
      pass-through / funnel account behaviour with no economic retention.
    params:
      max_hold_hours: 72
      min_passthrough_ratio: 0.80
      min_amount: 5000.0
    sweep_param: min_passthrough_ratio
    sweep_values: [0.60, 0.70, 0.80, 0.85, 0.90, 0.95]

  - id: R03_ROUND_DOLLAR
    name: Round-dollar layering
    description: >-
      Disproportionate share of exact round-value transfers. Legitimate
      commercial payments carry invoice-driven cents; layering rarely does.
    params:
      min_round_share: 0.55
      min_txn_count: 4
      min_amount: 1000.0
    sweep_param: min_round_share
    sweep_values: [0.35, 0.45, 0.55, 0.65, 0.75, 0.85]

  - id: R04_DORMANT_REACTIVATION
    name: Dormant account reactivation
    description: >-
      An account with no material activity that suddenly moves volume — the
      signature of a sold or hijacked mule account.
    params:
      dormancy_days: 90
      min_reactivation_amount: 15000.0
      min_reactivation_txns: 2
    sweep_param: min_reactivation_amount
    sweep_values: [5000.0, 10000.0, 15000.0, 25000.0, 40000.0, 60000.0]

  - id: R05_NEW_ACCOUNT_BURST
    name: New account rapid burst
    description: >-
      High throughput within the first weeks of onboarding, before any
      behavioural baseline exists to compare against.
    params:
      account_age_days: 60
      min_txn_count: 6
      min_total_amount: 25000.0
    sweep_param: min_total_amount
    sweep_values: [10000.0, 20000.0, 25000.0, 40000.0, 60000.0, 90000.0]

  - id: R06_COUNTERPARTY_CONCENTRATION
    name: Counterparty concentration
    description: >-
      Volume funnelled through very few counterparties (Herfindahl-style
      concentration), inconsistent with declared broad commercial activity.
    params:
      min_concentration: 0.70
      min_txn_count: 5
      min_total_amount: 20000.0
    sweep_param: min_concentration
    sweep_values: [0.50, 0.60, 0.70, 0.80, 0.90, 0.95]

  - id: R07_HIGH_RISK_CORRIDOR
    name: High-risk jurisdiction corridor exposure
    description: >-
      Material share of value settling into or out of FATF high-risk and
      comprehensively sanctioned jurisdictions.
    params:
      min_corridor_share: 0.30
      min_corridor_amount: 10000.0
      min_txn_count: 2
    sweep_param: min_corridor_share
    sweep_values: [0.15, 0.20, 0.30, 0.40, 0.55, 0.70]

  - id: R08_CASH_INTENSITY
    name: Cash intensity versus declared profile
    description: >-
      Cash share far above the peer baseline for the customer's declared
      segment. Peer-relative, not absolute, so cash businesses are not alerted
      simply for being cash businesses.
    params:
      min_cash_share: 0.65
      min_cash_amount: 20000.0
      min_txn_count: 4
    sweep_param: min_cash_share
    sweep_values: [0.40, 0.50, 0.65, 0.75, 0.85, 0.95]

model:
  # Split strategy is grouped on customer_id: a customer never appears on both
  # sides of the split, so nothing can be memorised at the entity level.
  split:
    strategy: grouped_by_customer
    test_fraction: 0.25
    out_of_time_months: 3
  lightgbm:
    objective: binary
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 20
    subsample: 0.85
    subsample_freq: 1
    colsample_bytree: 0.80
    reg_lambda: 2.0
    n_jobs: 1
    deterministic: true
    force_row_wise: true
    verbose: -1
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.80
    reg_lambda: 2.0
    n_jobs: 1
    tree_method: hist
  isolation_forest:
    n_estimators: 200
    max_samples: 4096
    contamination: 0.02
    n_jobs: 1
  # Leakage tripwires.
  #
  # The supervised ceiling is deliberately NOT set at 0.90. At 0.4% prevalence
  # the ROC geometry forces it: reaching 85% recall at a 25:1 review ratio means
  # operating at roughly 8.5% false-positive rate, and the area under any curve
  # passing through (0.085, 0.85) is at least 0.88. A 0.90 ceiling would
  # therefore flag correct behaviour as a defect. 0.92 sits above the honest
  # band and far below the 0.99 signature that actual leakage produces.
  max_plausible_roc_auc: 0.92
  min_plausible_roc_auc: 0.70
  # The sharper test, and the one that actually caught a real bug during
  # development. An Isolation Forest never sees the labels, so if it separates
  # the classes well the positives must be raw-space outliers — which means the
  # generator, not the model, is doing the work. It scored 0.979 on the first
  # version of this dataset and that is what exposed the additive-injection bug.
  max_unsupervised_roc_auc: 0.93
  target_recall: 0.85
