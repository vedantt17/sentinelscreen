# Synthetic data generation parameters.
#
# The unit of analysis for the transaction-monitoring model is the
# CUSTOMER-MONTH with at least one transaction ("scored cell"). Anomaly and
# near-miss rates below are expressed against that population, because that is
# what an alert queue is actually drawn from.

seed: 20240613
start_date: "2024-01-01"
months: 12

volumes:
  watchlist_entities: 5000
  customers: 50000
  transactions: 500000

# Activity mix. Real retail portfolios are heavily zero-inflated: most accounts
# barely move, a thin tail carries the volume. Non-separability depends on this
# tail existing, because the high-activity legitimate accounts are what the
# typologies have to hide inside.
activity_mix:
  - {segment: DORMANT_RETAIL, weight: 0.34, annual_txns_mean: 1.5,  annual_txns_shape: 0.9}
  - {segment: SALARIED,       weight: 0.30, annual_txns_mean: 9.0,  annual_txns_shape: 0.6}
  - {segment: SMALL_BUSINESS, weight: 0.22, annual_txns_mean: 16.0, annual_txns_shape: 0.7}
  - {segment: CASH_INTENSIVE, weight: 0.08, annual_txns_mean: 30.0, annual_txns_shape: 0.8}
  - {segment: TRADE_CORRIDOR, weight: 0.06, annual_txns_mean: 34.0, annual_txns_shape: 0.8}

watchlist:
  # Share of SDN records carrying each realistic data-quality defect. These are
  # not decorative: missing DOB is the single biggest driver of false positives
  # in production screening, because it removes the strongest corroborator.
  missing_dob_rate: 0.34
  missing_nationality_rate: 0.22
  partial_address_rate: 0.41
  honorific_rate: 0.18
  name_order_swap_rate: 0.12
  alias_count_max: 3
  script_mix: {latin: 0.44, arabic: 0.24, cyrillic: 0.18, chinese: 0.14}
  programs: [SDGT, SDNTK, NPWMD, IRAN, UKRAINE-EO13662, DPRK, SYRIA, CYBER2, IRGC, TCO]

screening_ground_truth:
  # Customers deliberately planted as genuine watchlist hits, carrying
  # transliteration / ordering / honorific noise so the matcher has to work.
  true_match_customers: 140
  # Confusable-but-clean customers: common surname collisions, shared DOBs with
  # different names, and same-nationality homographs. These exist to make
  # screening precision an honest number rather than a rounding artefact.
  near_miss_customers: 1600

typologies:
  # Fraction of SCORED customer-months that are genuine AML anomalies.
  anomaly_rate: 0.004
  # Fraction of scored customer-months that look like a typology but are not.
  near_miss_rate: 0.030

  # Both populations are rendered by ONE generator (src/data/typologies.py).
  # They differ in the mix below and in an intensity multiplier whose
  # distributions overlap heavily. If they differed in anything the feature set
  # can see, the model would separate them and every metric downstream would be
  # a statement about the generator rather than about monitoring.
  anomaly_mix: {structuring: 0.28, rapid_movement: 0.20, high_risk_corridor: 0.18,
                sanctioned_counterparty: 0.12, dormant_reactivation: 0.10, layering: 0.12}
  near_miss_mix: {structuring: 0.30, rapid_movement: 0.22, high_risk_corridor: 0.20,
                  sanctioned_counterparty: 0.06, dormant_reactivation: 0.08, layering: 0.14}

  intensity:
    # Positives rendered as nothing at all: laundering executed too quietly to
    # move a monthly aggregate. These put a hard ceiling on achievable recall,
    # which is the single most important realism knob in the whole generator.
    invisible_share: 0.09
    # Log-scale centres of the intensity multiplier. The gap between them is
    # what the model actually has to learn; widen it and ROC-AUC climbs toward
    # the leakage tripwire, close it and the problem becomes unlearnable.
    anomaly_log_mean: 0.30
    near_miss_log_mean: 0.18
    log_sigma: 0.50
  # Share of injected transactions offset by deleting ordinary activity from the
  # same cell. At 1.0 the injection is exactly size-preserving: the typology
  # replaces traffic rather than adding to it, so transaction count carries no
  # information about the label and the signal lives entirely in the shape of
  # the transactions.
  substitution_ratio: 1.0
  window_months: {min: 1, max: 2}

corridors:
  high_risk: [IR, KP, SY, CU, RU, BY, MM, AF, VE, YE]
  medium_risk: [AE, TR, CY, MT, PA, HK, LB, KZ, NG, PK]
  low_risk: [US, GB, DE, FR, CA, AU, JP, NL, SE, CH, SG, IE, ES, IT]

amounts:
  # Currency Transaction Report threshold: the reason structuring clusters just
  # below 10,000 rather than at any other round number.
  ctr_threshold: 10000.0
  structuring_band: [8200.0, 9900.0]
  round_dollar_multiples: [1000.0, 5000.0, 10000.0]
  lognormal: {mu: 6.4, sigma: 1.35}
