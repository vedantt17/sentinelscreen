name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"          # dict/set iteration order must not vary between jobs
  PYTHONIOENCODING: "utf-8"    # the name corpus is not ASCII

jobs:
  test:
    name: tests and typing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: make install

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

  reproduce:
    name: determinism
    runs-on: ubuntu-latest
    # The determinism guarantee is the repository's central claim, so it is
    # enforced here rather than asserted in the README. This job runs the whole
    # pipeline twice from a cold start and fails on any artefact byte difference.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: make install

      - name: Run the pipeline twice and diff every artefact
        run: make reproduce

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-report
          path: outputs/reproducibility_report.json
          if-no-files-found: warn
